[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/efe-clk/interpres"

[workspace.dependencies]
interpres-core = { path = "crates/interpres-core" }
interpres-engine-deepl = { path = "crates/interpres-engine-deepl" }
interpres-engine-claude = { path = "crates/interpres-engine-claude" }
interpres-docs = { path = "crates/interpres-docs" }
interpres-daemon = { path = "crates/interpres-daemon" }
interpres-ocr = { path = "crates/interpres-ocr" }
interpres-overlay = { path = "crates/interpres-overlay" }
interpres-speech = { path = "crates/interpres-speech" }
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io"] }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
cosmic-text = "0.19"
cpal = "0.18"
csv = "1"
directories = "6"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "4"
libwayshot-xcap = "0.3.3"
ort = "=2.0.0-rc.15"
rusqlite = { version = "0.43", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "query", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21.1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs", "sync", "time", "net", "signal"] }
tokio-util = "0.7"
tiny-skia = "0.12"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whisper-rs = { version = "0.16", features = ["vulkan", "tracing_backend"] }
wiremock = "0.6"
xcap = "0.9.10"
yaml-rust2 = "0.13"
tauri = "2"
tauri-build = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
