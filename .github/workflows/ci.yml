name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev libgbm-dev libdrm-dev libegl1-mesa-dev libwayland-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libdbus-1-dev libxkbcommon-dev clang \
            libasound2-dev libvulkan-dev glslc
      # whisper.cpp's GPU backend (interpres-speech) needs the Vulkan headers, the
      # loader (vulkan-1.dll, also needed to start the test binaries) and glslc.
      # whisper.cpp's Vulkan shader tool builds in deep folders; MSBuild fails past
      # 260 characters, so keep the target directory short on Windows.
      - name: Short target directory
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: 1.4.363.1
          install_runtime: true
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.os == 'Windows' && '. -> C:\t' || '. -> target' }}
      - run: cargo fmt --all --check
      - run: cargo build --workspace --locked
      - run: cargo build --workspace --locked --all-features
      - run: cargo test --workspace --locked --all-features
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
