name: Release

# Pushing a tag like v0.1.0 builds the installers and the CLI for Linux and
# Windows and publishes them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --title "Interpres $GITHUB_REF_NAME" --generate-notes
          echo "id=$(gh api repos/$GITHUB_REPOSITORY/releases \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id")" >> "$GITHUB_OUTPUT"

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the AppImage and deb compatible with older glibc.
          - os: ubuntu-22.04
            cli_name: interpres-cli-${{ github.ref_name }}-x86_64-linux.tar.gz
          - os: windows-latest
            cli_name: interpres-cli-${{ github.ref_name }}-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: apps/desktop
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create.outputs.release_id }}
      - name: Build CLI
        run: cargo build --release --locked -p interpres-cli
      - name: Package CLI (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.cli_name }}" -C target/release interpres -C "$GITHUB_WORKSPACE" LICENSE
      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/interpres.exe, LICENSE -DestinationPath "${{ matrix.cli_name }}"
      - name: Upload CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.cli_name }}" --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
