name: Release

# Pushing a tag like v0.1.0 builds the installers and the CLI for Linux and
# Windows and publishes them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # whisper.cpp: build for a common CPU baseline (AVX2), not the runner's CPU.
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/packaging/ggml-portable.cmake

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        # The id comes from the create response: a draft is not yet tied to its tag,
        # so it cannot be looked up by tag name.
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Interpres $GITHUB_REF_NAME" \
            -F draft=true -F generate_release_notes=true --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04: the screen-capture stack needs PipeWire newer than 22.04 ships.
          # The AppImage and deb therefore need glibc 2.39 (Ubuntu 24.04+,
          # Fedora 40+, Debian 13, Arch).
          - os: ubuntu-24.04
            cli_name: interpres-cli-${{ github.ref_name }}-x86_64-linux.tar.gz
          - os: windows-latest
            cli_name: interpres-cli-${{ github.ref_name }}-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libpipewire-0.3-dev libgbm-dev libdrm-dev libegl1-mesa-dev libwayland-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libdbus-1-dev libxkbcommon-dev clang patchelf \
            libasound2-dev libvulkan-dev glslc
      # whisper.cpp's Vulkan shader tool builds in deep folders; MSBuild fails past
      # 260 characters, so keep the target directory short on Windows.
      - name: Short target directory
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1.7.0
        with:
          vulkan_version: 1.4.363.1
          install_runtime: true
          cache: true
      # Shipped next to the exe (tauri.windows.conf.json) so the app starts on PCs
      # without GPU drivers; speech then runs on the CPU.
      - name: Vulkan loader for the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item C:\VulkanSDK\1.4.363.1\runtime\x64\vulkan-1.dll apps/desktop/src-tauri/vulkan-1.dll
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ runner.os == 'Windows' && '. -> C:\t' || '. -> target' }}
      - run: npm ci
        working-directory: apps/desktop
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create.outputs.release_id }}
      - name: Build CLI and MCP server
        run: cargo build --release --locked -p interpres-cli -p interpres-mcp -p interpres-daemon
      - name: Package CLI (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.cli_name }}" -C target/release interpres interpres-mcp interpres-daemon -C "$GITHUB_WORKSPACE" LICENSE -C packaging/linux interpres-daemon.service
      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path C:\t\release\interpres.exe, C:\t\release\interpres-mcp.exe, C:\t\release\interpres-daemon.exe, apps/desktop/src-tauri/vulkan-1.dll, LICENSE -DestinationPath "${{ matrix.cli_name }}"
      - name: Upload CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ needs.create.outputs.release_id }}/assets?name=${{ matrix.cli_name }}" \
            --input "${{ matrix.cli_name }}" --silent

  publish:
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.create.outputs.release_id }}" \
            -F draft=false --silent
