name: Release

# Pushing a tag like v0.1.0 builds the installers and the CLI for Linux and
# Windows and publishes them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        # The id comes from the create response: a draft is not yet tied to its tag,
        # so it cannot be looked up by tag name.
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Interpres $GITHUB_REF_NAME" \
            -F draft=true -F generate_release_notes=true --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the AppImage and deb compatible with older glibc.
          - os: ubuntu-22.04
            cli_name: interpres-cli-${{ github.ref_name }}-x86_64-linux.tar.gz
          - os: windows-latest
            cli_name: interpres-cli-${{ github.ref_name }}-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: apps/desktop
      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create.outputs.release_id }}
      - name: Build CLI and MCP server
        run: cargo build --release --locked -p interpres-cli -p interpres-mcp -p interpres-daemon
      - name: Package CLI (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.cli_name }}" -C target/release interpres interpres-mcp interpres-daemon -C "$GITHUB_WORKSPACE" LICENSE
      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/interpres.exe, target/release/interpres-mcp.exe, target/release/interpres-daemon.exe, LICENSE -DestinationPath "${{ matrix.cli_name }}"
      - name: Upload CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ needs.create.outputs.release_id }}/assets?name=${{ matrix.cli_name }}" \
            --input "${{ matrix.cli_name }}" --silent

  publish:
    needs: [create, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.create.outputs.release_id }}" \
            -F draft=false --silent
